<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OpsBridge | Admin{% endblock %}</title>
    {% block head_scripts %}{% endblock %}
    <style>
      :root {
        color-scheme: light;
        --ink: #16213e;
        --muted: #5b6475;
        --line: #d9dfeb;
        --panel: #ffffff;
        --accent: #d96c06;
        --accent-soft: #ffe5cc;
        --bg: linear-gradient(135deg, #f7f2e8 0%, #e9f0f7 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background: var(--bg);
      }

      main {
        width: min(980px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2.5rem 0 4rem;
      }

      .page-header {
        margin-bottom: 1.25rem;
      }

      .admin-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 1px solid var(--line);
        padding: 0.7rem 1rem;
        color: var(--ink);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.7);
      }

      .nav-link.active {
        background: var(--accent-soft);
        border-color: #efbf87;
      }

      .panel {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 1.25rem;
        box-shadow: 0 18px 40px rgba(22, 33, 62, 0.08);
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 0.4rem;
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: bold;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1, h2 {
        margin: 0;
      }

      .lede {
        color: var(--muted);
        line-height: 1.6;
      }

      .section-stack {
        display: grid;
        gap: 1rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        padding: 0.8rem 1.1rem;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.3rem 0.75rem;
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 0.92rem;
      }

      .mono {
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.92rem;
      }

      .metric-grid {
        display: grid;
        gap: 1rem;
      }

      .metric-card {
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 1rem 1.1rem;
      }

      .metric-label {
        margin: 0 0 0.35rem;
        color: var(--muted);
        font-size: 0.86rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .metric-value {
        margin: 0;
        font-size: 2rem;
        line-height: 1;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.75rem;
      }

      .table th,
      .table td {
        padding: 0.8rem 0;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .table th {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .footer-note {
        margin-top: 1.5rem;
        color: var(--muted);
        font-size: 0.93rem;
        text-align: center;
      }

      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    <main>
      {% include "admin/_nav.html" %}
      {% block content %}{% endblock %}
      <p class="footer-note">
        OpsBridge portfolio demo: browser-first workflows, mocked integrations, and audit-friendly operations tooling.
      </p>
    </main>
  </body>
</html>
